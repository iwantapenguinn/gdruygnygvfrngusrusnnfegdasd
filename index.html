<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f14">
  <title>Image Archive</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0f14; --panel:#151821; --text:#f3f5fa; --muted:#9aa3b5; --line:#292e3a; --accent:#a8b7ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:inherit; }
    .shell { width:min(1180px,calc(100% - 36px)); margin:0 auto; padding:54px 0 36px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:30px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
    h1 { font-size:clamp(32px,5vw,48px); line-height:1.05; letter-spacing:-.045em; margin:9px 0 8px; }
    .sub { color:var(--muted); margin:0; }
    .count { white-space:nowrap; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:8px 13px; font-size:13px; }
    .toolbar { display:flex; gap:12px; margin-bottom:24px; }
    input { width:100%; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; outline:none; }
    input:focus { border-color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .item { overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:15px; min-width:0; }
    .preview { display:grid; place-items:center; height:210px; background:#0a0c10; overflow:hidden; }
    .preview img { display:block; width:100%; height:100%; object-fit:contain; }
    .details { padding:12px; }
    .filename { font-weight:650; overflow-wrap:anywhere; margin-bottom:10px; }
    .actions { display:flex; gap:8px; }
    .actions a,.actions button { display:inline-flex; justify-content:center; align-items:center; text-decoration:none; border:1px solid var(--line); border-radius:9px; padding:7px 10px; background:transparent; color:var(--text); font:inherit; font-size:12px; cursor:pointer; }
    .actions a:first-child { background:var(--accent); border-color:var(--accent); color:#101321; font-weight:700; }
    .status { padding:52px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:15px; }
    footer { color:var(--muted); font-size:12px; padding-top:28px; text-align:center; }
    [hidden] { display:none!important; }
    @media(max-width:520px) { .shell { width:min(100% - 24px,1180px); padding-top:34px; } header { align-items:start; flex-direction:column; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .preview { height:155px; } .details { padding:9px; } .actions { flex-wrap:wrap; } }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="eyebrow">Public image library</div><h1>Image archive</h1><p class="sub">Every image in the collection, all in one place.</p></div><div class="count" id="count">Loading images…</div></header>
    <div class="toolbar"><input id="search" type="search" placeholder="Search images by filename…" aria-label="Search images"></div>
    <div id="status" class="status">Loading the image collection…</div>
    <section id="gallery" class="grid" aria-label="Image gallery"></section>
    <footer>Images are served directly from this site. Click an image URL to open it on its own.</footer>
  </main>
  <script>
    const OWNER = "nnezzy";
    const REPO = "host";
    const BRANCH = "main";
    const IMAGE_BASE = "/host/images/";
    const EXTENSIONS = new Set(["png","jpg","jpeg","gif","webp","avif","svg","ico","bmp"]);
    const gallery = document.querySelector("#gallery");
    const status = document.querySelector("#status");
    const count = document.querySelector("#count");
    const search = document.querySelector("#search");
    let images = [];

    function extensionOf(name) {
      const i = name.lastIndexOf(".");
      return i < 0 ? "" : name.slice(i + 1).toLowerCase();
    }

    function imageUrl(name) {
      return IMAGE_BASE + encodeURIComponent(name).replace(/%2F/gi, "/");
    }

    function makeCard(file) {
      const url = new URL(imageUrl(file.name), location.origin).href;
      const card = document.createElement("article");
      card.className = "item";

      const preview = document.createElement("a");
      preview.className = "preview";
      preview.href = url;
      preview.target = "_blank";
      preview.rel = "noopener";
      preview.setAttribute("aria-label", "Open " + file.name);

      const img = document.createElement("img");
      img.src = url;
      img.alt = file.name;
      img.loading = "lazy";
      img.onerror = () => {
        img.style.display = "none";
        preview.setAttribute("aria-label", "Image unavailable: " + file.name);
      };
      preview.append(img);

      const details = document.createElement("div");
      details.className = "details";

      const filename = document.createElement("div");
      filename.className = "filename";
      filename.textContent = file.name;

      const actions = document.createElement("div");
      actions.className = "actions";

      const open = document.createElement("a");
      open.href = url;
      open.target = "_blank";
      open.rel = "noopener";
      open.textContent = "Open image";

      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "Copy URL";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(url);
          copy.textContent = "Copied";
          setTimeout(() => copy.textContent = "Copy URL", 1200);
        } catch {
          prompt("Copy this image URL:", url);
        }
      });

      actions.append(open, copy);
      details.append(filename, actions);
      card.append(preview, details);
      return card;
    }

    function render() {
      const term = search.value.trim().toLowerCase();
      const shown = images.filter(file => file.name.toLowerCase().includes(term));

      gallery.replaceChildren(...shown.map(makeCard));
      count.textContent = shown.length + (shown.length === 1 ? " image" : " images");
      status.hidden = shown.length > 0;

      if (!shown.length) {
        status.textContent = images.length
          ? "No images match that search."
          : "No images found in the images/ folder yet.";
      }
    }

    async function init() {
      try {
        const response = await fetch(
          `https://api.github.com/repos/${OWNER}/${REPO}/contents/images?ref=${BRANCH}`
        );

        if (!response.ok) {
          throw new Error("GitHub returned " + response.status);
        }

        const files = await response.json();
        images = files
          .filter(file => file.type === "file" && EXTENSIONS.has(extensionOf(file.name)))
          .sort((a, b) => a.name.localeCompare(
            b.name,
            undefined,
            { numeric: true, sensitivity: "base" }
          ));

        render();
      } catch (error) {
        count.textContent = "Unavailable";
        status.textContent =
          "Could not load the image list. Make sure the GitHub repository is public and the images/ folder exists.";
        console.error(error);
      }
    }

    search.addEventListener("input", render);
    init();
  </script>
</body>
</html>
