<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f14">
  <title>Giphy Archive</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0f14; --panel:#151821; --text:#f3f5fa; --muted:#9aa3b5; --line:#292e3a; --accent:#16e0bd; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:inherit; }
    .shell { width:min(1180px,calc(100% - 36px)); margin:0 auto; padding:54px 0 36px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:30px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
    h1 { font-size:clamp(32px,5vw,48px); line-height:1.05; letter-spacing:-.045em; margin:9px 0 8px; }
    .sub { color:var(--muted); margin:0; }
    .count { white-space:nowrap; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:8px 13px; font-size:13px; }
    .toolbar { display:flex; gap:12px; margin-bottom:24px; }
    input { width:100%; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; outline:none; }
    input:focus { border-color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
    .item { overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:15px; min-width:0; display:flex; flex-direction:column; }
    .preview { display:grid; place-items:center; height:210px; background:#0a0c10; overflow:hidden; }
    .preview img { display:block; width:100%; height:100%; object-fit:cover; }
    .details { padding:12px; display:flex; flex-direction:column; flex:1; justify-content:space-between; }
    .filename { font-weight:650; overflow-wrap:anywhere; margin-bottom:10px; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .actions { display:flex; gap:8px; }
    .actions a,.actions button { display:inline-flex; justify-content:center; align-items:center; text-decoration:none; border:1px solid var(--line); border-radius:9px; padding:7px 10px; background:transparent; color:var(--text); font:inherit; font-size:12px; cursor:pointer; }
    .actions a:first-child { background:var(--accent); border-color:var(--accent); color:#0a0c10; font-weight:700; }
    .status { padding:52px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:15px; }
    footer { color:var(--muted); font-size:12px; padding-top:28px; text-align:center; }
    [hidden] { display:none!important; }
    @media(max-width:520px) { .shell { width:min(100% - 24px,1180px); padding-top:34px; } header { align-items:start; flex-direction:column; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .preview { height:155px; } .details { padding:9px; } .actions { flex-wrap:wrap; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Giphy Integration</div>
        <h1>GIF Archive</h1>
        <p class="sub">Trending and searchable GIFs powered by the Giphy API.</p>
      </div>
      <div class="count" id="count">Loading GIFs…</div>
    </header>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search Giphy (e.g. cats, coding, party)…" aria-label="Search GIFs">
    </div>
    <div id="status" class="status">Loading GIFs from Giphy…</div>
    <section id="gallery" class="grid" aria-label="GIF gallery"></section>
    <footer>Powered by the Giphy API. Click any GIF to open it directly.</footer>
  </main>

  <script>
    // Using Giphy's public beta/demo API key (for production apps, get your own free key at developers.giphy.com)
    const API_KEY = "7NHolm8hqmPBH1eSugs0fy2gxPs1tqrj"; 
    const gallery = document.querySelector("#gallery");
    const status = document.querySelector("#status");
    const count = document.querySelector("#count");
    const search = document.querySelector("#search");
    let searchTimeout = null;

    function makeCard(gif) {
      const url = gif.images.fixed_height.url;
      const originalUrl = gif.images.original.url;
      const card = document.createElement("article");
      card.className = "item";

      const preview = document.createElement("a");
      preview.className = "preview";
      preview.href = originalUrl;
      preview.target = "_blank";
      preview.rel = "noopener";
      preview.setAttribute("aria-label", "Open " + (gif.title || "GIF"));

      const img = document.createElement("img");
      img.src = url;
      img.alt = gif.title || "GIF";
      img.loading = "lazy";
      preview.append(img);

      const details = document.createElement("div");
      details.className = "details";

      const filename = document.createElement("div");
      filename.className = "filename";
      filename.textContent = gif.title || "Untitled GIF";

      const actions = document.createElement("div");
      actions.className = "actions";

      const open = document.createElement("a");
      open.href = originalUrl;
      open.target = "_blank";
      open.rel = "noopener";
      open.textContent = "Open GIF";

      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "Copy URL";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(originalUrl);
          copy.textContent = "Copied";
          setTimeout(() => copy.textContent = "Copy URL", 1200);
        } catch {
          prompt("Copy this GIF URL:", originalUrl);
        }
      });

      actions.append(open, copy);
      details.append(filename, actions);
      card.append(preview, details);
      return card;
    }

    async function fetchGifs(query = "") {
      status.hidden = false;
      status.textContent = "Searching Giphy…";
      
      try {
        let endpoint = `https://api.giphy.com/v1/gifs/trending?api_key=${API_KEY}&limit=24`;
        if (query.trim()) {
          endpoint = `https://api.giphy.com/v1/gifs/search?api_key=${API_KEY}&q=${encodeURIComponent(query)}&limit=24`;
        }

        const response = await fetch(endpoint);
        if (!response.ok) throw new Error("Giphy API error " + response.status);

        const data = await response.json();
        const gifs = data.data;

        gallery.replaceChildren(...gifs.map(makeCard));
        count.textContent = gifs.length + (gifs.length === 1 ? " GIF" : " GIFs");
        status.hidden = gifs.length > 0;

        if (!gifs.length) {
          status.textContent = "No GIFs found for that search.";
        }
      } catch (error) {
        count.textContent = "Unavailable";
        status.textContent = "Could not load GIFs from Giphy. Check your connection.";
        console.error(error);
      }
    }

    // Debounced live search as user types
    search.addEventListener("input", (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        fetchGifs(e.target.value);
      }, 400);
    });

    // Initial load (Trending)
    fetchGifs();
  </script>
</body>
</html>
