<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f14">
  <title>Giphy Archive</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0f14; --panel:#151821; --text:#f3f5fa; --muted:#9aa3b5; --line:#292e3a; --accent:#16e0bd; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    a { color:inherit; }
    .shell { width:min(1180px,calc(100% - 36px)); margin:0 auto; padding:54px 0 36px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:30px; }
    .header-right { display:flex; align-items:center; gap:12px; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
    h1 { font-size:clamp(32px,5vw,48px); line-height:1.05; letter-spacing:-.045em; margin:9px 0 8px; }
    .sub { color:var(--muted); margin:0; }
    .count { white-space:nowrap; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:8px 13px; font-size:13px; }
    .nav-btn { display:inline-flex; align-items:center; text-decoration:none; white-space:nowrap; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; transition:border-color 0.2s, background 0.2s; }
    .nav-btn:hover { border-color:var(--accent); background:var(--line); }
    .toolbar { display:flex; gap:12px; margin-bottom:24px; }
    input { width:100%; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; outline:none; }
    input:focus { border-color:var(--accent); }
    .search-btn { padding:0 20px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:#0a0c10; font:inherit; font-weight:700; cursor:pointer; white-space:nowrap; transition:opacity 0.2s; }
    .search-btn:hover { opacity: 0.9; }
    .search-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: var(--line); background: var(--panel); color: var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-bottom:30px; }
    .item { overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:15px; min-width:0; display:flex; flex-direction:column; }
    .preview { display:grid; place-items:center; height:210px; background:#0a0c10; overflow:hidden; }
    .preview img { display:block; width:100%; height:100%; object-fit:cover; }
    .details { padding:12px; display:flex; flex-direction:column; flex:1; justify-content:space-between; }
    .filename { font-weight:650; overflow-wrap:anywhere; margin-bottom:10px; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .actions { display:flex; gap:8px; }
    .actions a,.actions button { display:inline-flex; justify-content:center; align-items:center; text-decoration:none; border:1px solid var(--line); border-radius:9px; padding:7px 10px; background:transparent; color:var(--text); font:inherit; font-size:12px; cursor:pointer; }
    .actions a:first-child { background:var(--accent); border-color:var(--accent); color:#0a0c10; font-weight:700; }
    .status { padding:52px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:15px; margin-bottom:20px; }
    .load-more-container { text-align:center; margin:30px 0; }
    .load-more-btn { padding:12px 28px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; font-weight:650; cursor:pointer; transition:border-color 0.2s; }
    .load-more-btn:hover { border-color:var(--accent); }
    .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    footer { color:var(--muted); font-size:12px; padding-top:28px; text-align:center; }
    [hidden] { display:none!important; }
    @media(max-width:520px) { .shell { width:min(100% - 24px,1180px); padding-top:34px; } header { align-items:start; flex-direction:column; } .header-right { width:100%; justify-content:space-between; flex-wrap:wrap; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .preview { height:155px; } .details { padding:9px; } .actions { flex-wrap:wrap; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Giphy Integration</div>
        <h1>GIF Archive</h1>
        <p class="sub">Trending and searchable GIFs powered by the Giphy API.</p>
      </div>
      <div class="header-right">
        <a class="nav-btn" href="/host/">← Image Archive</a>
        <div class="count" id="count">Loading GIFs…</div>
      </div>
    </header>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search Giphy (e.g. cats, coding, party)…" aria-label="Search GIFs">
      <button id="search-btn" class="search-btn" type="button">Search</button>
    </div>
    <div id="status" class="status">Loading GIFs from Giphy…</div>
    <section id="gallery" class="grid" aria-label="GIF gallery"></
